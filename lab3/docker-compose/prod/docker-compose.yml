services:
  rabbit:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    extends:
      file: common-config.yml
      service: network-deploy-service

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    extends:
      file: common-config.yml
      service: network-deploy-service

  # Elasticsearch (Logging)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - ./elasticsearch-data:/usr/share/elasticsearch/data
    extends:
      file: common-config.yml
      service: network-deploy-service

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    ports:
      - '5775:5775/udp'    # UDP port for receiving traces
      - '6831:6831/udp'    # UDP port for receiving traces
      - '6832:6832/udp'    # UDP port for receiving traces
      - '5778:5778'        # HTTP port for service discovery
      - '16686:16686'      # Jaeger UI
      - '14268:14268'      # HTTP port for receiving traces
      - '14250:14250'      # gRPC port for OpenTelemetry
      - '9411:9411'        # Zipkin compatibility
    extends:
      file: common-config.yml
      service: network-deploy-service

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:latest
    ports:
      - "4317:4317"  # gRPC port for OTLP
      - "4318:4318"  # HTTP port for OTLP
    environment:
      # Add environment variables to configure the OpenTelemetry Collector
      - OTEL_TRACES_EXPORTER=jaeger
      - OTEL_METRICS_EXPORTER=prometheus
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14250
      - OTEL_SERVICE_NAME=otel-collector
    extends:
      file: common-config.yml
      service: network-deploy-service

